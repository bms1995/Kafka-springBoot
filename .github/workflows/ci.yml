name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  schema-contracts:
    name: Validate Avro contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate schemas
        shell: pwsh
        run: ./scripts/validate-avro-contracts.ps1

  test:
    name: Test services
    runs-on: ubuntu-latest
    needs: schema-contracts
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - order-service
          - payment-service
          - inventory-service
          - notification-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        env:
          TESTCONTAINERS_CHECKS_DISABLE: "true"
        run: mvn test

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - order-service
          - payment-service
          - inventory-service
          - notification-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: mvn -DskipTests package

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: kafka-springboot/${{ matrix.service }}:ci
