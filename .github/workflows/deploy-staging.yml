name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: true
        default: latest
      smoke_base_url:
        description: Optional public API Gateway base URL for smoke test
        required: false
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_STAGING: ${{ secrets.KUBE_CONFIG_STAGING }}
        run: |
          if [ -z "$KUBE_CONFIG_STAGING" ]; then
            echo "Missing KUBE_CONFIG_STAGING secret"
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_STAGING" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          if grep -q 'kubernetes\.docker\.internal' "$HOME/.kube/config"; then
            echo "KUBE_CONFIG_STAGING points to Docker Desktop (kubernetes.docker.internal)."
            echo "Docker Desktop Kubernetes is only reachable from your local machine, not from GitHub-hosted runners."
            echo "Use a kubeconfig for a remote cluster, or deploy Docker Desktop locally with scripts/deploy-staging.ps1."
            exit 1
          fi

      - name: Apply manifests
        run: kubectl apply -k overlays/staging --validate=false

      - name: Pin staging image tag
        run: |
          kubectl -n kafka-spring set image deployment/api-gateway api-gateway=ghcr.io/bms1995/kafka-springboot/api-gateway:${{ inputs.image_tag }}
          kubectl -n kafka-spring set image deployment/order-service order-service=ghcr.io/bms1995/kafka-springboot/order-service:${{ inputs.image_tag }}
          kubectl -n kafka-spring set image deployment/payment-service payment-service=ghcr.io/bms1995/kafka-springboot/payment-service:${{ inputs.image_tag }}
          kubectl -n kafka-spring set image deployment/inventory-service inventory-service=ghcr.io/bms1995/kafka-springboot/inventory-service:${{ inputs.image_tag }}
          kubectl -n kafka-spring set image deployment/notification-service notification-service=ghcr.io/bms1995/kafka-springboot/notification-service:${{ inputs.image_tag }}

      - name: Wait for rollout
        run: |
          kubectl -n kafka-spring rollout status deployment/api-gateway --timeout=180s
          kubectl -n kafka-spring rollout status deployment/order-service --timeout=180s
          kubectl -n kafka-spring rollout status deployment/payment-service --timeout=180s
          kubectl -n kafka-spring rollout status deployment/inventory-service --timeout=180s
          kubectl -n kafka-spring rollout status deployment/notification-service --timeout=180s

      - name: Smoke test public gateway
        if: inputs.smoke_base_url != ''
        shell: pwsh
        env:
          SMOKE_BASE_URL: ${{ inputs.smoke_base_url }}
          SMOKE_API_KEY: ${{ secrets.STAGING_API_KEY }}
        run: |
          if (-not $env:SMOKE_API_KEY) {
            throw "Missing STAGING_API_KEY secret"
          }
          ./scripts/smoke-test.ps1 -BaseUrl $env:SMOKE_BASE_URL -ApiKey $env:SMOKE_API_KEY
