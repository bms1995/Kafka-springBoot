services:

  postgres:
    image: postgres:16
    container_name: postgres-payment
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME:-paymentdb}
      POSTGRES_USER: ${PAYMENT_DB_USERNAME:-myuser}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-mypassword}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENT_DB_USERNAME:-myuser} -d ${PAYMENT_DB_NAME:-paymentdb}"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-inventory:
    image: postgres:16
    container_name: postgres-inventory
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME:-inventorydb}
      POSTGRES_USER: ${INVENTORY_DB_USERNAME:-myuser}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-mypassword}
    ports:
      - "5434:5432"
    volumes:
      - postgres_inventory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INVENTORY_DB_USERNAME:-myuser} -d ${INVENTORY_DB_NAME:-inventorydb}"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-order:
    image: postgres:16
    container_name: postgres-order
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME:-orderdb}
      POSTGRES_USER: ${ORDER_DB_USERNAME:-myuser}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-mypassword}
    ports:
      - "5435:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_DB_USERNAME:-myuser} -d ${ORDER_DB_NAME:-orderdb}"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnamilegacy/kafka:3.7.1-debian-12-r4
    container_name: kafka1
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - ALLOW_PLAINTEXT_LISTENER=yes
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: bitnamilegacy/kafka:3.7.1-debian-12-r4
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        KAFKA_TOPICS="/opt/bitnami/kafka/bin/kafka-topics.sh"
        for topic in \
          order-created \
          payment-processed \
          payment-failed \
          payment-refunded \
          inventory-updated \
          inventory-failed \
          order-created.DLQ \
          payment-processed.DLQ \
          payment-failed.DLQ \
          payment-refunded.DLQ \
          inventory-updated.DLQ \
          inventory-failed.DLQ
        do
          "$$KAFKA_TOPICS" --bootstrap-server kafka:9092 \
            --create --if-not-exists \
            --topic "$$topic" \
            --partitions 3 \
            --replication-factor 1
          "$$KAFKA_TOPICS" --bootstrap-server kafka:9092 \
            --alter \
            --topic "$$topic" \
            --partitions 3 || true
        done

  order-service:
    build:
      context: ./order-service
    image: kafka-springboot/order-service:local
    container_name: order-service
    environment:
      ORDER_DB_URL: jdbc:postgresql://postgres-order:5432/${ORDER_DB_NAME:-orderdb}
      ORDER_DB_USERNAME: ${ORDER_DB_USERNAME:-myuser}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:-mypassword}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 45s
    depends_on:
      postgres-order:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy

  api-gateway:
    build:
      context: ./api-gateway
    image: kafka-springboot/api-gateway:local
    container_name: api-gateway
    environment:
      ORDER_SERVICE_URL: http://order-service:8081
      PAYMENT_SERVICE_URL: http://payment-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8083
      INVENTORY_SERVICE_URL: http://inventory-service:8084
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 45s
    depends_on:
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy

  payment-service:
    build:
      context: ./payment-service
    image: kafka-springboot/payment-service:local
    container_name: payment-service
    environment:
      PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/${PAYMENT_DB_NAME:-paymentdb}
      PAYMENT_DB_USERNAME: ${PAYMENT_DB_USERNAME:-myuser}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-mypassword}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy

  notification-service:
    build:
      context: ./notification-service
    image: kafka-springboot/notification-service:local
    container_name: notification-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 45s
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy

  inventory-service:
    build:
      context: ./inventory-service
    image: kafka-springboot/inventory-service:local
    container_name: inventory-service
    environment:
      INVENTORY_DB_URL: jdbc:postgresql://postgres-inventory:5432/${INVENTORY_DB_NAME:-inventorydb}
      INVENTORY_DB_USERNAME: ${INVENTORY_DB_USERNAME:-myuser}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-mypassword}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 45s
    depends_on:
      postgres-inventory:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui1
    ports:
      - "8085:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_0_SCHEMAREGISTRY=http://schema-registry:8081
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: kafka-exporter
    command:
      - --kafka.server=kafka:9092
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: schema-registry
    ports:
      - "8086:8081"
    environment:
      - SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS=PLAINTEXT://kafka:9092
      - SCHEMA_REGISTRY_HOST_NAME=schema-registry
      - SCHEMA_REGISTRY_LISTENERS=http://0.0.0.0:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
    depends_on:
      kafka:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin1
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-inventory:
        condition: service_healthy
      postgres-order:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  postgres_inventory_data:
  postgres_order_data:
  grafana_data:
