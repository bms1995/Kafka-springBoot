groups:
  - name: microservices-alerts
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"

      - alert: PaymentOutboxPublishFailures
        expr: increase(payment_outbox_publish_failed_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Payment outbox publishing failures detected"

      - alert: OrderOutboxPublishFailures
        expr: increase(order_outbox_publish_failed_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Order outbox publishing failures detected"

      - alert: PaymentDeadOutboxEvents
        expr: payment_outbox_dead_events > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Payment outbox has dead events"

      - alert: OrderDeadOutboxEvents
        expr: order_outbox_dead_events > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Order outbox has dead events"

      - alert: PaymentFailuresSpike
        expr: increase(payment_failed_total[5m]) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Payment failures increased"

      - alert: PaymentServiceHealthDown
        expr: max_over_time(application_ready_time_seconds{application="payment-service"}[5m]) unless up{job="payment-service"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Payment service health is not ready"

      - alert: KafkaConsumerLagHigh
        expr: sum by (consumergroup, topic) (kafka_consumergroup_lag) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag is high for {{ $labels.consumergroup }} on {{ $labels.topic }}"

      - alert: KafkaExporterDown
        expr: up{job="kafka-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kafka exporter is down"
