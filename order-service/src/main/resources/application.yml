server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5435/orderdb}
    username: ${ORDER_DB_USERNAME:myuser}
    password: ${ORDER_DB_PASSWORD:mypassword}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8086}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8086}
        specific.avro.reader: true

app:
  kafka:
    topics:
      order-created: ${ORDER_CREATED_TOPIC:order-created}
      payment-processed: ${PAYMENT_PROCESSED_TOPIC:payment-processed}
      payment-failed: ${PAYMENT_FAILED_TOPIC:payment-failed}
      payment-refunded: ${PAYMENT_REFUNDED_TOPIC:payment-refunded}
      inventory-updated: ${INVENTORY_UPDATED_TOPIC:inventory-updated}
      inventory-failed: ${INVENTORY_FAILED_TOPIC:inventory-failed}
  outbox:
    publish-delay-ms: ${OUTBOX_PUBLISH_DELAY_MS:1000}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}

logging:
  level:
    org.apache.kafka: INFO
    com.example.orderservice: INFO
  pattern:
    level: "%5p [${spring.application.name:order-service},%X{traceId:-},%X{spanId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: order-service
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
