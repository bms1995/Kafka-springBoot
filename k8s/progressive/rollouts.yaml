apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api-gateway
  namespace: kafka-spring
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    canary:
      steps:
        - setWeight: 10
        - pause:
            duration: 60s
        - setWeight: 50
        - pause:
            duration: 120s
        - setWeight: 100
      analysis:
        templates:
          - templateName: api-gateway-slo
        startingStep: 1
        args:
          - name: service-name
            value: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      priorityClassName: kafka-spring-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: ghcr.io/bms1995/kafka-springboot/api-gateway:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: microservices-config
            - secretRef:
                name: microservices-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: api-gateway
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: api-gateway-slo
  namespace: kafka-spring
spec:
  args:
    - name: service-name
  metrics:
    - name: gateway-5xx-rate
      interval: 30s
      count: 3
      successCondition: result[0] < 0.02
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-operated.monitoring:9090
          query: |
            sum(rate(http_server_requests_seconds_count{application="{{args.service-name}}",status=~"5.."}[2m]))
            /
            clamp_min(sum(rate(http_server_requests_seconds_count{application="{{args.service-name}}"}[2m])), 1)
    - name: gateway-p95-latency
      interval: 30s
      count: 3
      successCondition: result[0] < 1
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-operated.monitoring:9090
          query: |
            histogram_quantile(
              0.95,
              sum(rate(http_server_requests_seconds_bucket{application="{{args.service-name}}"}[2m])) by (le)
            )
