apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: kafka-spring-critical
value: 100000
globalDefault: false
description: "Priority for customer-facing kafka-spring application workloads."
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: kafka-spring-compute
  namespace: kafka-spring
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "12"
    limits.memory: 16Gi
    pods: "40"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: kafka-spring-defaults
  namespace: kafka-spring
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      default:
        cpu: 1000m
        memory: 1Gi
      min:
        cpu: 50m
        memory: 128Mi
      max:
        cpu: 2000m
        memory: 2Gi
