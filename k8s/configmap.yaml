apiVersion: v1
kind: ConfigMap
metadata:
  name: microservices-config
  namespace: kafka-spring
data:
  ORDER_SERVICE_URL: http://order-service:8081
  PAYMENT_SERVICE_URL: http://payment-service:8082
  INVENTORY_SERVICE_URL: http://inventory-service:8084
  NOTIFICATION_SERVICE_URL: http://notification-service:8083
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SCHEMA_REGISTRY_URL: http://schema-registry:8081
  OTEL_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
  API_GATEWAY_API_KEY_ENABLED: "true"
  API_GATEWAY_API_KEY_HEADER: X-API-Key
  API_GATEWAY_JWT_ENABLED: "false"
  API_GATEWAY_JWT_ISSUER_URI: ""
  API_GATEWAY_RATE_LIMIT_ENABLED: "true"
  API_GATEWAY_RATE_LIMIT_REQUESTS: "60"
  API_GATEWAY_RATE_LIMIT_WINDOW: 1m
