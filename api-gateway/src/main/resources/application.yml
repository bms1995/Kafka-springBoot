server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: order-service
                fallbackUri: forward:/fallback/order-service
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/payments/**
          filters:
            - name: CircuitBreaker
              args:
                name: payment-service
                fallbackUri: forward:/fallback/payment-service
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/inventory/**
          filters:
            - name: CircuitBreaker
              args:
                name: inventory-service
                fallbackUri: forward:/fallback/inventory-service
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/notifications/**
          filters:
            - name: CircuitBreaker
              args:
                name: notification-service
                fallbackUri: forward:/fallback/notification-service

resilience4j:
  circuitbreaker:
    instances:
      order-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      payment-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      inventory-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      notification-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  timelimiter:
    instances:
      order-service:
        timeout-duration: 3s
      payment-service:
        timeout-duration: 3s
      inventory-service:
        timeout-duration: 3s
      notification-service:
        timeout-duration: 3s

app:
  security:
    api-key:
      enabled: ${API_GATEWAY_API_KEY_ENABLED:true}
      header-name: ${API_GATEWAY_API_KEY_HEADER:X-API-Key}
      value: ${API_GATEWAY_API_KEY:local-dev-key}
    jwt:
      enabled: ${API_GATEWAY_JWT_ENABLED:false}
      issuer-uri: ${API_GATEWAY_JWT_ISSUER_URI:}
  rate-limit:
    enabled: ${API_GATEWAY_RATE_LIMIT_ENABLED:true}
    requests-per-window: ${API_GATEWAY_RATE_LIMIT_REQUESTS:60}
    window: ${API_GATEWAY_RATE_LIMIT_WINDOW:1m}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.example.apigateway: INFO
  pattern:
    level: "%5p [${spring.application.name:api-gateway},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
    gateway:
      enabled: true
  metrics:
    tags:
      application: api-gateway
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
