server:
  port: 8082

spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5433/paymentdb}
    username: ${PAYMENT_DB_USERNAME:myuser}
    password: ${PAYMENT_DB_PASSWORD:mypassword}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: payment-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8086}
        specific.avro.reader: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8086}
        enable.idempotence: true
        acks: all
        retries: 10
        max.in.flight.requests.per.connection: 5

app:
  kafka:
    topics:
      order-created: ${ORDER_CREATED_TOPIC:order-created}
      payment-processed: ${PAYMENT_PROCESSED_TOPIC:payment-processed}
      payment-failed: ${PAYMENT_FAILED_TOPIC:payment-failed}
      payment-refunded: ${PAYMENT_REFUNDED_TOPIC:payment-refunded}
      inventory-failed: ${INVENTORY_FAILED_TOPIC:inventory-failed}
  outbox:
    publish-delay-ms: ${OUTBOX_PUBLISH_DELAY_MS:1000}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
    base-backoff-ms: ${OUTBOX_BASE_BACKOFF_MS:1000}
    max-backoff-ms: ${OUTBOX_MAX_BACKOFF_MS:60000}
    processing-timeout-ms: ${OUTBOX_PROCESSING_TIMEOUT_MS:120000}

logging:
  level:
    org.apache.kafka: INFO
    com.example.paymentservice: INFO
  pattern:
    level: "%5p [${spring.application.name:payment-service},%X{traceId:-},%X{spanId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: payment-service
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
